apply plugin: 'com.android.application'

def localSigningProps = new Properties()
def localSigningPropsFile = file("C:/BuildToolset/signing/signing.properties")
if (localSigningPropsFile.exists()) {
    localSigningPropsFile.withInputStream { localSigningProps.load(it) }
}
def localVc = 215
def vcFile = file("C:/BuildToolset/signing/version-codes.json")
if (vcFile.exists()) {
    def m = (vcFile.text =~ /"KIDS_Photo"\s*:\s*(\d+)/)
    if (m.find()) { localVc = Math.max(215, m.group(1).toInteger()) }
}
def envVc = System.getenv("KIDSPHOTO_VERSION_CODE")
def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
def computedVersionCode = envVc ? envVc.toInteger() : (ciRunNumber ? (100 + ciRunNumber.toInteger()) : localVc)
def releaseKeystorePath = System.getenv("KIDSPHOTO_KEYSTORE") ?: localSigningProps.getProperty("KIDSPHOTO_KEYSTORE")
def releaseKeystorePw = System.getenv("KIDSPHOTO_KEYSTORE_PASSWORD") ?: localSigningProps.getProperty("KEYSTORE_PASSWORD")
def releaseKeystoreAlias = System.getenv("KIDSPHOTO_KEY_ALIAS") ?: localSigningProps.getProperty("KIDSPHOTO_KEY_ALIAS") ?: "kidsphoto"
def releaseKeystoreFile = releaseKeystorePath ? file(releaseKeystorePath) : null

android {
    namespace = "com.bluewind.kidsphoto"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bluewind.kidsphoto"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName "1.1.${computedVersionCode}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseKeystoreFile != null && releaseKeystoreFile.exists() && releaseKeystorePw) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseKeystorePw
                keyAlias releaseKeystoreAlias
                keyPassword releaseKeystorePw
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
